<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">GCP Platform Operations — reference architecture</title><desc id="desc">GCP operations architecture: Terraform provisions a secured VPC and GKE foundation; GitHub Actions and Cloud Build publish containers to Artifact Registry; DNS, HTTPS load balancing and Cloud Armor route traffic to GKE; workload identity, secrets, monitoring and incident runbooks support operations.</desc>
