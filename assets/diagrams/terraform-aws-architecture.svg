<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">AWS Infrastructure as Code — reference architecture</title><desc id="desc">AWS Infrastructure as Code reference architecture; the accompanying architecture walkthrough describes its components and flow.</desc>
<defs><linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D4ED8"/><stop offset="1" stop-color="#0B1E5B"/></linearGradient><linearGradient id="mint" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#2463E8"/><stop offset="1" stop-color="#93C5FD"/></linearGradient><radialGradient id="halo"><stop stop-color="#2463E8" stop-opacity=".2"/><stop offset="1" stop-color="#2463E8" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#101828" stroke-opacity=".065"/></pattern><filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0B1220" flood-opacity=".28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2463E8"/></marker></defs>
<rect width="100%" height="100%" fill="#F1F6FC"/><rect width="100%" height="100%" fill="url(#grid)"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#101828}.mono{font-family:monospace;letter-spacing:2px}.secondary{fill:#475467}</style><text x="48" y="53" font-size="27" font-weight="600">AWS Infrastructure as Code</text><text x="48" y="84" class="mono secondary" font-size="12">REFERENCE ARCHITECTURE / WINDSOR HARLOW</text><g data-architecture-node="pull-request" class="architecture-node"><rect x="48" y="181" width="242" height="80" rx="8" fill="#FFFFFF" stroke="#C9D8EE" stroke-width="1.5"/><text x="66" y="212" font-size="18" font-weight="600">Pull request</text><text x="66" y="236" font-size="14" class="secondary">Version-controlled changes</text></g><g data-architecture-node="github-actions" class="architecture-node"><rect x="335" y="181" width="242" height="80" rx="8" fill="#FFFFFF" stroke="#C9D8EE" stroke-width="1.5"/><text x="353" y="212" font-size="18" font-weight="600">GitHub Actions</text><text x="353" y="236" font-size="14" class="secondary">Terraform plan + review</text></g><g data-architecture-node="approved-merge" class="architecture-node"><rect x="622" y="181" width="242" height="80" rx="8" fill="#FFFFFF" stroke="#C9D8EE" stroke-width="1.5"/><text x="640" y="212" font-size="18" font-weight="600">Approved merge</text><text x="640" y="236" font-size="14" class="secondary">Terraform apply</text></g><g data-architecture-node="aws-environment" class="architecture-node"><rect x="909" y="181" width="242" height="80" rx="8" fill="#FFFFFF" stroke="#C9D8EE" stroke-width="1.5"/><text x="927" y="212" font-size="18" font-weight="600">AWS environment</text><text x="927" y="236" font-size="14" class="secondary">Network · compute · storage</text></g><path d="M290 221h43" fill="none" stroke="#2463E8" stroke-width="2" marker-end="url(#arrow)"/><path d="M577 221h43" fill="none" stroke="#2463E8" stroke-width="2" marker-end="url(#arrow)"/><path d="M864 221h43" fill="none" stroke="#2463E8" stroke-width="2" marker-end="url(#arrow)"/><g data-architecture-node="terraform-modules" class="architecture-node"><rect x="48" y="414" width="310" height="80" rx="8" fill="#E3EEFD" stroke="#7FA8EE" stroke-width="1.5"/><text x="66" y="445" font-size="18" font-weight="600">Terraform modules</text><text x="66" y="469" font-size="14" class="secondary">VPC · EC2 · storage · IAM</text></g><g data-architecture-node="remote-state" class="architecture-node"><rect x="449" y="414" width="310" height="80" rx="8" fill="#FFFFFF" stroke="#C9D8EE" stroke-width="1.5"/><text x="467" y="445" font-size="18" font-weight="600">Remote state</text><text x="467" y="469" font-size="14" class="secondary">S3 + DynamoDB locking</text></g><g data-architecture-node="short-lived-access" class="architecture-node"><rect x="849" y="414" width="303" height="80" rx="8" fill="#FFFFFF" stroke="#C9D8EE" stroke-width="1.5"/><text x="867" y="445" font-size="18" font-weight="600">Short-lived access</text><text x="867" y="469" font-size="14" class="secondary">OIDC → AWS IAM role</text></g><path d="M203 414V362H457V263" fill="none" stroke="#2463E8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><path d="M604 414V363H744V263" fill="none" stroke="#2463E8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><path d="M1000 414V315H745V263" fill="none" stroke="#2463E8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><g data-architecture-node="reviewed-repeatable-changes" class="architecture-node"><rect x="48" y="644" width="1103" height="80" rx="8" fill="#E3EEFD" stroke="#7FA8EE" stroke-width="1.5"/><text x="66" y="675" font-size="18" font-weight="600">Reviewed, repeatable changes</text><text x="66" y="699" font-size="14" class="secondary">Separate modules compose environments. CI provides the shared application path and change history.</text></g></svg>