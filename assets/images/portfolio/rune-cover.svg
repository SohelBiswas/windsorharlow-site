<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Rune — reference architecture</title>
<desc id="desc">CLI and HTTP API requests enter the Rune Go process; AES-256-GCM protects records in BoltDB. A passphrase and Argon2id derive the in-memory key used while the vault is unsealed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#A9C8DA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="600" fill="#071D2B"/>
<style>text{font-family:Archivo,Arial,Helvetica,sans-serif}</style>
<text x="38" y="43" fill="#A9C8DA" font-size="20" font-weight="400" text-anchor="start">Reference architecture</text>
<path d="M38 73H922" fill="none" stroke="#087FC3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="324" y="120" width="312" height="260" rx="4" fill="none" stroke="#087FC3" stroke-width="1.5" stroke-dasharray="5 5"/><text x="346" y="155" fill="#FFFFFF" font-size="23" font-weight="500" text-anchor="start">Rune / Go process</text><g transform="translate(450 190) scale(1.3333333333333333)" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="21" width="30" height="23" rx="2"/><path d="M15 21V12a9 9 0 0 1 18 0v9M24 30v6"/></g><text x="480" y="297" fill="#FFFFFF" font-size="25" font-weight="500" text-anchor="middle">Sealed by default</text><text x="480" y="329" fill="#A9C8DA" font-size="18" font-weight="400" text-anchor="middle">Namespaced access</text><g transform="translate(91 191) scale(1.3125)" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="2"/><path d="m12 17 7 7-7 7M25 31h10"/></g><text x="122" y="295" fill="#FFFFFF" font-size="24" font-weight="400" text-anchor="middle">CLI / HTTP API</text><text x="122" y="324" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="middle">Developer requests</text><path d="M216 246H322" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M637 246H747" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="692" y="221" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="middle">Encrypt</text><g transform="translate(801 187) scale(1.3333333333333333)" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="10" rx="16" ry="6"/><path d="M8 10v28c0 8 32 8 32 0V10M8 23c0 8 32 8 32 0"/></g><text x="833" y="291" fill="#FFFFFF" font-size="25" font-weight="500" text-anchor="middle">BoltDB</text><text x="833" y="322" fill="#A9C8DA" font-size="18" font-weight="400" text-anchor="middle">AES-256-GCM</text><path d="M267 488H326" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M591 488H650" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M786 443V416H480V382" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 7"/><rect x="38" y="444" width="229" height="88" rx="3" fill="#071D2B" fill-opacity="1" stroke="#087FC3" stroke-width="1.5"/><g transform="translate(58 465) scale(0.6666666666666666)" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="16" r="10"/><path d="m22 23 18 18m-8-8 5-5m-1 9 5-5"/></g><text x="106" y="479" fill="#FFFFFF" font-size="24" font-weight="500" text-anchor="start">Passphrase</text><text x="106" y="508" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Unseal the vault</text><rect x="328" y="444" width="263" height="88" rx="3" fill="#071D2B" fill-opacity="1" stroke="#087FC3" stroke-width="1.5"/><text x="348" y="479" fill="#FFFFFF" font-size="24" font-weight="500" text-anchor="start">Argon2id</text><text x="348" y="508" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Derive the key</text><rect x="652" y="444" width="270" height="88" rx="3" fill="#071D2B" fill-opacity="1" stroke="#087FC3" stroke-width="1.5"/><text x="672" y="479" fill="#FFFFFF" font-size="24" font-weight="500" text-anchor="start">Key in memory</text><text x="672" y="508" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Active while unsealed</text><text x="38" y="568" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Encrypted records at rest. Hashed access tokens.</text>
</svg>