<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Atlas Platform — reference architecture</title>
<desc id="desc">The client requests temporary upload access from Django, then uploads file bytes directly to S3. A completion request records the document and queues Celery processing through SQS. PostgreSQL, Redis, monitoring and EKS autoscaling support the workload.</desc>
