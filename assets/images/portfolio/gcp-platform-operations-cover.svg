<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">GCP Platform Operations — reference architecture</title>
<desc id="desc">Terraform and container delivery feed GKE. DNS, load balancing and Cloud Armor route traffic. Identity, secrets, monitoring and an operations feedback loop support the platform.</desc>
