<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes Delivery on EKS — reference architecture</title>
<desc id="desc">GitHub Actions builds application changes into versioned Docker images in a registry. Amazon EKS routes ingress traffic through a service to a rolling deployment with readiness and liveness checks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#A9C8DA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="600" fill="#071D2B"/>
<style>text{font-family:Archivo,Arial,Helvetica,sans-serif}</style>
<text x="38" y="43" fill="#A9C8DA" font-size="20" font-weight="400" text-anchor="start">Reference architecture</text>
<path d="M38 73H922" fill="none" stroke="#087FC3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="38" y="120" width="246" height="88" rx="3" fill="#071D2B" fill-opacity="1" stroke="#087FC3" stroke-width="1.5"/><g transform="translate(58 141) scale(0.6666666666666666)" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14 5 24l11 10M32 14l11 10-11 10M27 8l-6 32"/></g><text x="106" y="155" fill="#FFFFFF" font-size="24" font-weight="500" text-anchor="start">Application</text><text x="106" y="184" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Commit + merge</text><rect x="358" y="120" width="246" height="88" rx="3" fill="#071D2B" fill-opacity="1" stroke="#087FC3" stroke-width="1.5"/><text x="378" y="155" fill="#FFFFFF" font-size="24" font-weight="500" text-anchor="start">GitHub Actions</text><text x="378" y="184" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Build Docker image</text><rect x="678" y="120" width="244" height="88" rx="3" fill="#071D2B" fill-opacity="1" stroke="#087FC3" stroke-width="1.5"/><g transform="translate(698 141) scale(0.6666666666666666)" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m24 4 20 10-20 10L4 14Zm-20 20 20 10 20-10M4 34l20 10 20-10"/></g><text x="746" y="155" fill="#FFFFFF" font-size="24" font-weight="500" text-anchor="start">Registry</text><text x="746" y="184" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Versioned images</text><path d="M284 164H356" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M604 164H676" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M800 208V298" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="38" y="297" width="884" height="247" rx="4" fill="none" stroke="#087FC3" stroke-width="1.5" stroke-dasharray="5 5"/><text x="60" y="332" fill="#FFFFFF" font-size="23" font-weight="500" text-anchor="start">Amazon EKS</text><rect x="68" y="370" width="198" height="88" rx="3" fill="#071D2B" fill-opacity="1" stroke="#087FC3" stroke-width="1.5"/><text x="88" y="405" fill="#FFFFFF" font-size="24" font-weight="500" text-anchor="start">Ingress</text><text x="88" y="434" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Route traffic</text><rect x="326" y="370" width="198" height="88" rx="3" fill="#071D2B" fill-opacity="1" stroke="#087FC3" stroke-width="1.5"/><text x="346" y="405" fill="#FFFFFF" font-size="24" font-weight="500" text-anchor="start">Service</text><text x="346" y="434" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Ready endpoints</text><rect x="584" y="370" width="304" height="88" rx="3" fill="#087FC3" fill-opacity="0.12" stroke="#087FC3" stroke-width="1.5"/><g transform="translate(604 391) scale(0.6666666666666666)" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="38" height="15" rx="2"/><rect x="5" y="28" width="38" height="15" rx="2"/><path d="M12 12h2m7 0h15M12 35h2m7 0h15"/></g><text x="652" y="405" fill="#FFFFFF" font-size="24" font-weight="500" text-anchor="start">Deployment</text><text x="652" y="434" fill="#A9C8DA" font-size="17" font-weight="400" text-anchor="start">Rolling replacement</text><path d="M266 414H324" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M524 414H582" fill="none" stroke="#A9C8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="68" y="510" fill="#A9C8DA" font-size="20" font-weight="400" text-anchor="start">Readiness gates traffic</text><text x="534" y="510" fill="#A9C8DA" font-size="20" font-weight="400" text-anchor="start">Liveness supports recovery</text>
</svg>