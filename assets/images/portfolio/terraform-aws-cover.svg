<title id="title">AWS Infrastructure as Code — reference architecture</title>
<desc id="desc">A pull request feeds Terraform plan and review in GitHub Actions. Approved changes apply AWS modules for networking, compute, storage and IAM, with shared state and short-lived OIDC access.</desc>
