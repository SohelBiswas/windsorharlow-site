<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
<title id="title">Atlas Platform — reference architecture</title><desc id="desc">Atlas reference architecture: the client requests upload access from Django, uploads directly to S3, then commits the document through the API. SQS feeds Celery workers; PostgreSQL stores records, Redis caches reads and task results, and EKS scaling, delivery, security and monitoring support operations.</desc>
<defs><linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28708B"/><stop offset="1" stop-color="#0A3647"/></linearGradient><linearGradient id="mint" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1693A6"/><stop offset="1" stop-color="#87F5D0"/></linearGradient><radialGradient id="halo"><stop stop-color="#3BBFBB" stop-opacity=".2"/><stop offset="1" stop-color="#3BBFBB" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#123D4C" stroke-opacity=".065"/></pattern><filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#021E27" flood-opacity=".28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#429AB2"/></marker></defs>
<rect width="100%" height="100%" fill="#E8F0F2"/><rect width="100%" height="100%" fill="url(#grid)"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#123D4C}.mono{font-family:monospace;letter-spacing:2px}.secondary{fill:#466876}</style><text x="48" y="53" font-size="27" font-weight="600">Atlas Platform</text><text x="48" y="84" class="mono secondary" font-size="12">REFERENCE ARCHITECTURE / WINDSOR HARLOW</text><text x="48" y="129" class="mono secondary" font-size="12">REQUEST ACCESS / UPLOAD DIRECTLY / CONFIRM COMPLETION</text><g data-architecture-node="client" class="architecture-node"><rect x="48" y="150" width="246" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="66" y="181" font-size="18" font-weight="600">Client</text><text x="66" y="205" font-size="14" class="secondary">Request URL · upload · confirm</text></g><g data-architecture-node="secure-endpoint" class="architecture-node"><rect x="350" y="150" width="246" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="368" y="181" font-size="18" font-weight="600">Secure endpoint</text><text x="368" y="205" font-size="14" class="secondary">Route 53 · ALB · WAF · ACM</text></g><g data-architecture-node="django-api" class="architecture-node"><rect x="652" y="150" width="246" height="80" rx="8" fill="#D4EBE9" stroke="#71ABAE" stroke-width="1.5"/><text x="670" y="181" font-size="18" font-weight="600">Django API</text><text x="670" y="205" font-size="14" class="secondary">Tenant-scoped document records</text></g><g data-architecture-node="rds-postgresql" class="architecture-node"><rect x="954" y="150" width="198" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="972" y="181" font-size="18" font-weight="600">RDS PostgreSQL</text><text x="972" y="205" font-size="14" class="secondary">PgBouncer / replica</text></g><path d="M294 190H348" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M596 190H650" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M898 190H952" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><g data-architecture-node="s3-raw-files" class="architecture-node"><rect x="48" y="320" width="246" height="80" rx="8" fill="#D4EBE9" stroke="#71ABAE" stroke-width="1.5"/><text x="66" y="351" font-size="18" font-weight="600">S3 raw files</text><text x="66" y="375" font-size="14" class="secondary">Direct presigned PUT</text></g><g data-architecture-node="celery-workers" class="architecture-node"><rect x="350" y="320" width="246" height="92" rx="8" fill="#D4EBE9" stroke="#71ABAE" stroke-width="1.5"/><text x="368" y="351" font-size="18" font-weight="600">Celery workers</text><text x="368" y="375" font-size="14" class="secondary">Ingest / transform</text><text x="368" y="394" font-size="14" class="secondary">Notify / reports</text></g><g data-architecture-node="amazon-sqs" class="architecture-node"><rect x="652" y="320" width="246" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="670" y="351" font-size="18" font-weight="600">Amazon SQS</text><text x="670" y="375" font-size="14" class="secondary">4 workload queues + DLQs</text></g><g data-architecture-node="elasticache-redis" class="architecture-node"><rect x="954" y="320" width="198" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="972" y="351" font-size="18" font-weight="600">ElastiCache Redis</text><text x="972" y="375" font-size="14" class="secondary">Cache + task results</text></g><path d="M171 230V318" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M775 230V318" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M652 360H598" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M294 360H348" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><text x="206" y="273" class="mono secondary" font-size="12">FILE BYTES BYPASS API</text><path d="M898 214H930V360H952" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M473 320V288H1053V232" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M596 390H624V455H1053V402" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><g data-architecture-node="s3-derived-files" class="architecture-node"><rect x="48" y="500" width="246" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="66" y="531" font-size="18" font-weight="600">S3 derived files</text><text x="66" y="555" font-size="14" class="secondary">Text / chunks / previews</text></g><g data-architecture-node="celery-beat" class="architecture-node"><rect x="350" y="500" width="246" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="368" y="531" font-size="18" font-weight="600">Celery Beat</text><text x="368" y="555" font-size="14" class="secondary">Scheduled reports / maintenance</text></g><g data-architecture-node="build-release" class="architecture-node"><rect x="652" y="500" width="246" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="670" y="531" font-size="18" font-weight="600">Build + release</text><text x="670" y="555" font-size="14" class="secondary">GitHub Actions / ECR / Argo CD</text></g><g data-architecture-node="secrets-identity" class="architecture-node"><rect x="954" y="500" width="198" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="972" y="531" font-size="18" font-weight="600">Secrets + identity</text><text x="972" y="555" font-size="14" class="secondary">IRSA / managed secrets</text></g><path d="M350 382H318V540H296" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M473 500V474H775V402" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="640" class="mono secondary" font-size="12">PLATFORM OPERATIONS / SEPARATE FROM DOCUMENT TRAFFIC</text><g data-architecture-node="scaling-on-eks" class="architecture-node"><rect x="48" y="674" width="338" height="90" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="66" y="705" font-size="18" font-weight="600">Scaling on EKS</text><text x="66" y="729" font-size="14" class="secondary">HPA / KEDA / Karpenter</text><text x="66" y="748" font-size="14" class="secondary">Pod demand / queue depth / nodes</text></g><g data-architecture-node="monitoring" class="architecture-node"><rect x="430" y="674" width="338" height="90" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="448" y="705" font-size="18" font-weight="600">Monitoring</text><text x="448" y="729" font-size="14" class="secondary">CloudWatch / Prometheus / Grafana</text><text x="448" y="748" font-size="14" class="secondary">Metrics, logs and alerting</text></g><g data-architecture-node="operational-runbooks" class="architecture-node"><rect x="812" y="674" width="340" height="90" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="830" y="705" font-size="18" font-weight="600">Operational runbooks</text><text x="830" y="729" font-size="14" class="secondary">Load tests / failure scenarios</text><text x="830" y="748" font-size="14" class="secondary">Diagnosis and resource review</text></g><path d="M768 719H810" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/></svg>