<style>text{font-family:Arial,Helvetica,sans-serif;fill:#123D4C}.mono{font-family:monospace;letter-spacing:2px}.secondary{fill:#466876}</style><text x="48" y="53" font-size="27" font-weight="600">Rune</text><text x="48" y="84" class="mono secondary" font-size="12">REFERENCE ARCHITECTURE / WINDSOR HARLOW</text><g data-architecture-node="cli-http-api" class="architecture-node"><rect x="48" y="177" width="290" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="66" y="208" font-size="18" font-weight="600">CLI / HTTP API</text><text x="66" y="232" font-size="14" class="secondary">Developer requests</text></g><g data-architecture-node="rune-vault" class="architecture-node"><rect x="455" y="177" width="290" height="80" rx="8" fill="#D4EBE9" stroke="#71ABAE" stroke-width="1.5"/><text x="473" y="208" font-size="18" font-weight="600">Rune vault</text><text x="473" y="232" font-size="14" class="secondary">Go process</text></g><g data-architecture-node="encrypted-storage" class="architecture-node"><rect x="862" y="177" width="290" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="880" y="208" font-size="18" font-weight="600">Encrypted storage</text><text x="880" y="232" font-size="14" class="secondary">Embedded BoltDB</text></g><path d="M338 217H453" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 217H860" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><g data-architecture-node="passphrase" class="architecture-node"><rect x="48" y="395" width="290" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="66" y="426" font-size="18" font-weight="600">Passphrase</text><text x="66" y="450" font-size="14" class="secondary">Argon2id key derivation</text></g><g data-architecture-node="unsealed-key" class="architecture-node"><rect x="455" y="395" width="290" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="473" y="426" font-size="18" font-weight="600">Unsealed key</text><text x="473" y="450" font-size="14" class="secondary">Held in process memory</text></g><g data-architecture-node="secret-encryption" class="architecture-node"><rect x="862" y="395" width="290" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="880" y="426" font-size="18" font-weight="600">Secret encryption</text><text x="880" y="450" font-size="14" class="secondary">AES-256-GCM + nonce</text></g><path d="M338 435H453" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 435H860" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 395V259" fill="none" stroke="#429AB2" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><path d="M1007 395V259" fill="none" stroke="#429AB2" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><g data-architecture-node="access-boundaries" class="architecture-node"><rect x="48" y="641" width="1103" height="80" rx="8" fill="#D4EBE9" stroke="#71ABAE" stroke-width="1.5"/><text x="66" y="672" font-size="18" font-weight="600">Access boundaries</text><text x="66" y="696" font-size="14" class="secondary">Sealed startup · namespaces · hashed tokens. Encryption at rest does not protect a compromised running host.</text></g></svg>