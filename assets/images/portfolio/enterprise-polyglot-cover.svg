<text x="38" y="43" fill="#A9C8DA" font-size="20" font-weight="400" text-anchor="start">Reference architecture</text>
<path d="M38 73H922" fill="none" stroke="#087FC3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
