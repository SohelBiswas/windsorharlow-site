<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Enterprise Polyglot Microservices Pipeline — reference architecture</title>
<desc id="desc">TLS ingress routes to parallel Java and Python services on Amazon EKS, backed by PostgreSQL. Vault supplies secrets; Jenkins builds, Trivy scans and the deployment workflow releases to Kubernetes.</desc>
