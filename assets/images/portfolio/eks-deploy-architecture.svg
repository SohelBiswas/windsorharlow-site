ht="191" rx="12" fill="#DEEDEF" stroke="#9FBFC9"/><text x="70" y="389" class="mono secondary" font-size="12">KUBERNETES DELIVERY</text><g data-architecture-node="ingress-service" class="architecture-node"><rect x="73" y="420" width="310" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="91" y="451" font-size="18" font-weight="600">Ingress + Service</text><text x="91" y="475" font-size="14" class="secondary">Traffic routing</text></g><g data-architecture-node="deployment" class="architecture-node"><rect x="448" y="420" width="310" height="80" rx="8" fill="#D4EBE9" stroke="#71ABAE" stroke-width="1.5"/><text x="466" y="451" font-size="18" font-weight="600">Deployment</text><text x="466" y="475" font-size="14" class="secondary">Gradual replica replacement</text></g><g data-architecture-node="health-checks" class="architecture-node"><rect x="824" y="420" width="303" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="842" y="451" font-size="18" font-weight="600">Health checks</text><text x="842" y="475" font-size="14" class="secondary">Readiness + liveness</text></g><path d="M383 460H446" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M758 460H822" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M1030 261V334H603V418" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><g data-architecture-node="release-and-recovery" class="architecture-node"><rect x="48" y="645" width="1103" height="80" rx="8" fill="#D4EBE9" stroke="#71ABAE" stroke-width="1.5"/><text x="66" y="676" font-size="18" font-weight="600">Release and recovery</text><text x="66" y="700" font-size="14" class="secondary">Promote versioned images, observe rollout health and restore the prior image when recovery calls for it.</text></g></svg>