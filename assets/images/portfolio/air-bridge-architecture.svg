<style>text{font-family:Arial,Helvetica,sans-serif;fill:#123D4C}.mono{font-family:monospace;letter-spacing:2px}.secondary{fill:#466876}</style><text x="48" y="53" font-size="27" font-weight="600">Air Bridge</text><text x="48" y="84" class="mono secondary" font-size="12">REFERENCE ARCHITECTURE / WINDSOR HARLOW</text><g data-architecture-node="desktop-interface" class="architecture-node"><rect x="48" y="171" width="286" height="80" rx="8" fill="#D4EBE9" stroke="#71ABAE" stroke-width="1.5"/><text x="66" y="202" font-size="18" font-weight="600">Desktop interface</text><text x="66" y="226" font-size="14" class="secondary">Electron + Node.js</text></g><g data-architecture-node="adb-bridge" class="architecture-node"><rect x="454" y="171" width="286" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="472" y="202" font-size="18" font-weight="600">ADB bridge</text><text x="472" y="226" font-size="14" class="secondary">Wireless pairing + commands</text></g><g data-architecture-node="android-device" class="architecture-node"><rect x="861" y="171" width="290" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="879" y="202" font-size="18" font-weight="600">Android device</text><text x="879" y="226" font-size="14" class="secondary">Wireless debugging enabled</text></g><path d="M334 211H452" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M740 211H859" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><g data-architecture-node="apk-drop-target" class="architecture-node"><rect x="48" y="383" width="286" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="66" y="414" font-size="18" font-weight="600">APK drop target</text><text x="66" y="438" font-size="14" class="secondary">Drag-and-drop build install</text></g><g data-architecture-node="connection-state" class="architecture-node"><rect x="454" y="383" width="286" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="472" y="414" font-size="18" font-weight="600">Connection state</text><text x="472" y="438" font-size="14" class="secondary">Model · OS · battery</text></g><g data-architecture-node="device-discovery" class="architecture-node"><rect x="861" y="383" width="290" height="80" rx="8" fill="#F8FBFC" stroke="#B3CBD2" stroke-width="1.5"/><text x="879" y="414" font-size="18" font-weight="600">Device discovery</text><text x="879" y="438" font-size="14" class="secondary">Find available debugging devices</text></g><path d="M191 383V253" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M597 383V253" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><path d="M1006 383V253" fill="none" stroke="#429AB2" stroke-width="2" marker-end="url(#arrow)"/><g data-architecture-node="one-desktop-codebase" class="architecture-node"><rect x="48" y="634" width="1103" height="80" rx="8" fill="#D4EBE9" stroke="#71ABAE" stroke-width="1.5"/><text x="66" y="665" font-size="18" font-weight="600">One desktop codebase</text><text x="66" y="689" font-size="14" class="secondary">electron-builder packages for Windows, macOS and Linux. scrcpy is bundled for device tooling.</text></g></svg>